name: Build Windows Executable (.EXE) & Setup Wizard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build FastPOS App Directory (PyInstaller)
      run: |
        pyinstaller --clean -y FastPOS.spec

    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress -y

    - name: Compile Windows Setup Wizard (FastPOS_Setup_v1.0.exe)
      shell: pwsh
      run: |
        $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
        if (-not (Test-Path $isccPath)) {
            $isccPath = "$env:ProgramFiles\Inno Setup 6\iscc.exe"
        }
        if (-not (Test-Path $isccPath)) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $isccPath = $cmd.Source }
        }
        Write-Host "Using ISCC compiler at: $isccPath"
        & $isccPath installer.iss

    - name: Build Standalone Single-File Executable
      run: |
        pyinstaller -y --onefile --windowed --icon=icon.ico --distpath dist_portable --add-data="icon.png;." --add-data="icon.ico;." --add-data="pos_default.db;." --hidden-import=PyQt6 --hidden-import=PyQt6.QtCore --hidden-import=PyQt6.QtGui --hidden-import=PyQt6.QtWidgets --hidden-import=PyQt6.QtPrintSupport --hidden-import=jinja2 --hidden-import=requests --hidden-import=barcode --hidden-import=barcode.codex --hidden-import=sqlite3 --name="FastPOS_Portable" main.py

    - name: Upload Windows Setup Wizard (Like Chrome / WhatsApp)
      uses: actions/upload-artifact@v4
      with:
        name: FastPOS-Windows-Setup-Wizard
        path: dist/FastPOS_Setup_v1.0.exe
        retention-days: 30

    - name: Upload FastPOS Portable Single-File .EXE
      uses: actions/upload-artifact@v4
      with:
        name: FastPOS-Windows-Portable-EXE
        path: dist_portable/FastPOS_Portable.exe
        retention-days: 30

    - name: Publish Direct .EXE to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      with:
        tag_name: v1.0.0
        name: "FastPOS Desktop Terminal v1.0.0 (Windows Builds)"
        body: |
          ### 🚀 FastPOS Premium Desktop Terminal v1.0.0
          High-performance multi-tenant desktop terminal with offline SQLite caching and cloud sync.

          #### 📥 Windows Downloads:
          - **[FastPOS_Setup_v1.0.exe](https://github.com/MohamedSaman/POSFast/releases/download/v1.0.0/FastPOS_Setup_v1.0.exe)**: Complete Setup Wizard Installer (Recommended).
          - **[FastPOS_Portable.exe](https://github.com/MohamedSaman/POSFast/releases/download/v1.0.0/FastPOS_Portable.exe)**: Standalone portable single-file executable (no installation required).
        files: |
          dist/FastPOS_Setup_v1.0.exe
          dist_portable/FastPOS_Portable.exe
        prerelease: false

